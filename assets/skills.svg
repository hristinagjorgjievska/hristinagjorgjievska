<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300">
<style>.m{font-family:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}.s{font-family:'Quicksand','Segoe UI',Helvetica,Arial,sans-serif}.a{opacity:0;animation:in .6s ease forwards}.a1{animation-delay:.1s}.a2{animation-delay:.4s}.a3{animation-delay:.6s}.a4{animation-delay:.8s}.a5{animation-delay:1s}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
<g class="a a1"><text x="12" y="26" class="m" font-size="14" fill="#c48aa8" font-style="italic">// I build full-stack applications and explore how</text><text x="12" y="50" class="m" font-size="14" fill="#c48aa8" font-style="italic">// AI agents and LLMs connect to real-world systems.</text></g>
<g class="a a2"><rect x="10" y="74" width="405" height="100" rx="14" fill="#fff7fb" stroke="#fbcfe8" stroke-width="2"/><circle cx="36" cy="102" r="5" fill="#ec4899"/><text x="50" y="107" class="s" font-size="17" font-weight="700" fill="#9d174d">Backend</text><text x="30" y="135" class="s" font-size="13.5" fill="#be185d">Layered Spring Boot services, REST APIs</text><text x="30" y="155" class="s" font-size="13.5" fill="#be185d">and schemas that stay clean as they grow.</text></g>
<g class="a a3"><rect x="425" y="74" width="405" height="100" rx="14" fill="#fff7fb" stroke="#fbcfe8" stroke-width="2"/><circle cx="451" cy="102" r="5" fill="#f472b6"/><text x="465" y="107" class="s" font-size="17" font-weight="700" fill="#9d174d">Frontend</text><text x="445" y="135" class="s" font-size="13.5" fill="#be185d">React + TypeScript interfaces that make</text><text x="445" y="155" class="s" font-size="13.5" fill="#be185d">complex data easy to use.</text></g>
<g class="a a4"><rect x="10" y="188" width="405" height="100" rx="14" fill="#fff7fb" stroke="#fbcfe8" stroke-width="2"/><circle cx="36" cy="216" r="5" fill="#db2777"/><text x="50" y="221" class="s" font-size="17" font-weight="700" fill="#9d174d">LLM &amp; RAG</text><text x="30" y="249" class="s" font-size="13.5" fill="#be185d">Integrating language models and building RAG</text><text x="30" y="269" class="s" font-size="13.5" fill="#be185d">pipelines that ground answers in real data.</text></g>
<g class="a a5"><rect x="425" y="188" width="405" height="100" rx="14" fill="#fff7fb" stroke="#fbcfe8" stroke-width="2"/><circle cx="451" cy="216" r="5" fill="#f9a8d4"/><text x="465" y="221" class="s" font-size="17" font-weight="700" fill="#9d174d">AI integration</text><text x="445" y="249" class="s" font-size="13.5" fill="#be185d">Exposing app logic as tools that AI agents</text><text x="445" y="269" class="s" font-size="13.5" fill="#be185d">can call through the Model Context Protocol.</text></g>
</svg>
